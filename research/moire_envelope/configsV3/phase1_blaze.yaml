# Phase 1 V3 (BLAZE) Configuration — Multi-Band Fractional Coordinates
# =====================================================================
# High-performance local Bloch solver using blaze2d package.
# Part of the V3 multi-band pipeline using fractional coordinates.
# See 5_FinalMultiBandTwoScaleEA.md for theory details.

# -------------------------------------------------------------------------
# Run Directory
# -------------------------------------------------------------------------
output_dir: runsV3

# -------------------------------------------------------------------------
# Candidate Selection
# -------------------------------------------------------------------------
# Number of top candidates to process from Phase 0
K_candidates: 1

# Or specify a specific candidate ID
# phase1_candidate_id: 0

# -------------------------------------------------------------------------
# Moiré Parameters
# -------------------------------------------------------------------------
# Default twist angle (used if candidate doesn't have one)
default_theta_deg: 1.1

# Stacking gauge τ in monolayer fractional coordinates
tau: [0.0, 0.0]

# -------------------------------------------------------------------------
# Grid Resolution (V3: Fractional Coordinates)
# -------------------------------------------------------------------------
# Number of grid points in s1 and s2 directions on unit square [0,1)²
phase1_Ns1: 128
phase1_Ns2: 128

# -------------------------------------------------------------------------
# V3 Multi-Band Settings
# -------------------------------------------------------------------------
# Number of bands above/below the target band to include in subspace
# Total bands tracked: N_bands = 2*n_neighbor_bands + 1
n_neighbor_bands: 2

# Additional bands beyond subspace for Born-Huang potential
# Used for out-of-subspace mixing calculation (not tracked as envelopes)
n_extra_bands: 4

# -------------------------------------------------------------------------
# BLAZE Solver Settings
# -------------------------------------------------------------------------
# Number of threads (0 = all cores)
blaze_threads: 16

# Grid resolution for BLAZE eigensolves
blaze_resolution: 64

# Registry sampling resolution (interpolated to phase1_Ns1 x phase1_Ns2)
blaze_registry_samples: 64

# Finite difference settings for local band curvature
blaze_dk: 0.01  # k-space step
blaze_fd_order: 4  # 4th order FD for accurate derivatives

# Default polarization (overridden by candidate if available)
blaze_polarization: TM

# -------------------------------------------------------------------------
# Reference Frequency
# -------------------------------------------------------------------------
# How to choose ω_ref for potential V = ω₀ - ω_ref
# Options: "min", "max", "mean"
omega_ref_mode: min

# -------------------------------------------------------------------------
# Diagnostics
# -------------------------------------------------------------------------
# Minimum variation threshold for ω₀ (warn if below)
phase1_variation_tol: 1.0e-5
