# =============================================================================
# Thesis Config: honeycomb_K_b1_TE — Tang/Lou-inspired air-holes-in-Si, TE
# =============================================================================
# Attempt to match Tang et al. (2021 Light:Sci&App) as closely as possible
# in 2D. They use:
#   - Si membrane (ε ≈ 12.25) with triangular air holes
#   - Quasi-TE mode with Dirac cone at K
#   - Side length ≈ 0.3a → r/a ≈ 0.3 effective
#   - Magic angle: 1.89° (in 3D bilayer with PMMA spacer)
#
# Our 2D approximation:
#   - Air holes (ε=1.0) in Si background (ε=12.25)
#   - TE polarization → Dirac cone at K for air-in-dielectric honeycomb
#   - r/a = 0.30 (matching Tang's filling fraction)
#   - 2D single-layer moiré (no physical spacer)
#
# NOTE: Magic angle will DIFFER from Tang's 1.89° because:
#   1. Our system is 2D (no vertical confinement / slab guided modes)
#   2. No PMMA tunneling layer → different coupling strength
#   3. Single-layer moiré vs physical bilayer
# The VALUE is that we should still find A magic angle, confirming the
# framework works for TE air-hole honeycomb systems too.

# ---- Run Directory ----
output_dir: runsV3

# ---- Phase 1 ----
K_candidates: 1
default_theta_deg: 1.1
tau: [0.0, 0.0]
phase1_Ns1: 128
phase1_Ns2: 128
n_neighbor_bands: 2
n_extra_bands: 4
mpb_resolution: 64
mpb_registry_samples: 128
mpb_dk: 0.01
mpb_fd_order: 4
mpb_polarization: TE
export_bloch_fields: true
mpb_n_workers: 16
omega_ref_mode: min
phase1_variation_tol: 1.0e-5

# ---- Phase 2 ----
include_born_huang: false
include_drift_term: true
use_parallel_transport_gauge: true
berry_connection_dr: null
phase2_min_mass_eig: 1.0e-6

# ---- Phase 3 ----
n_envelope_eigenstates: 50
include_berry_connection: true
include_born_huang: false
include_drift_term: true
include_offdiag_A: true
use_sparse_solver: true
boundary_condition: periodic
s1_samples: 128
s2_samples: 128
phase3_supercell_tiles: [1, 1]
eigensolver_tol: 1.0e-10
eigensolver_max_iter: 1000
shift_invert_target: null
save_envelope_wavefunctions: true
save_band_components: true
phase3_plot_envelopes: true
