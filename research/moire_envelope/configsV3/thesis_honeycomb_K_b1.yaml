# =============================================================================
# Thesis Config: honeycomb_K_b1 (C_hc) — Honeycomb K-point Dirac cone, TM
# =============================================================================
# Candidate: honeycomb lattice (triangular + 2-atom basis), 
#   ε_rod=11.56 in air (ε_bg=1.0), r/a=0.2, K-point, TM polarization
# Dirac cone at K: ω_D ≈ 0.2744, v_D ≈ 0.0445
# Band pair: bands 1-2 degenerate at K (Dirac touching)
# Reference: Dong et al. (2021) photonic analogue of twisted bilayer graphene
#
# Phase 1/2/3 unified config — production settings

# ---- Run Directory ----
output_dir: runsV3

# ---- Phase 1 ----
K_candidates: 1
default_theta_deg: 1.1
tau: [0.0, 0.0]
phase1_Ns1: 128
phase1_Ns2: 128
n_neighbor_bands: 2
n_extra_bands: 4
mpb_resolution: 64
mpb_registry_samples: 128
mpb_dk: 0.01
mpb_fd_order: 4
mpb_polarization: TM
export_bloch_fields: true
mpb_n_workers: 16
omega_ref_mode: min
phase1_variation_tol: 1.0e-5

# ---- Phase 2 ----
include_born_huang: false
include_drift_term: true
use_parallel_transport_gauge: true
berry_connection_dr: null
phase2_min_mass_eig: 1.0e-6

# ---- Phase 3 ----
n_envelope_eigenstates: 50
include_berry_connection: true
include_born_huang: false
include_drift_term: true
include_offdiag_A: true
use_sparse_solver: true
boundary_condition: periodic
s1_samples: 128
s2_samples: 128
phase3_supercell_tiles: [1, 1]
eigensolver_tol: 1.0e-10
eigensolver_max_iter: 1000
shift_invert_target: null
save_envelope_wavefunctions: true
save_band_components: true
phase3_plot_envelopes: true
