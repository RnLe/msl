# Pipeline settings (shared across candidates)
pipeline:
  # Phase 1
  mpb_resolution: 64
  phase1_Ns1: 128
  phase1_Ns2: 128
  mpb_registry_samples: 128
  mpb_dk: 0.01
  mpb_fd_order: 4
  mpb_n_workers: 16
  export_bloch_fields: true
  omega_ref_mode: min

  # Phase 2
  include_born_huang: false
  include_drift_term: true
  use_parallel_transport_gauge: true

  # Phase 3
  n_envelope_eigenstates: 12
  include_berry_connection: true
  include_offdiag_A: true
  boundary_condition: periodic
  save_envelope_wavefunctions: true
  save_band_components: true

  # η-sweep
  theta_list: [0.5, 0.8, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0]

  # Symmetrization
  symmetrize_square: C4
  symmetrize_hex_M: C2
  symmetrize_honeycomb_K: C6
