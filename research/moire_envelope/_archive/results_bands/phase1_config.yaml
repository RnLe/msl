# Phase 1 V3 Configuration — Candidate Search Winner (square_X_b3)
# ===================================================================
# Custom config for the selected candidate:
#   square lattice, X-point, band 3, r/a=0.18, ε_bg=2.0
#   θ = 2.0° (V/E_kin ≈ 1.9 at this angle — sweet spot)

output_dir: runsV3

# Process exactly the winning candidate
K_candidates: 1
phase1_candidate_id: 214201

# θ = 2.0° — sweet spot where V/E_kin ≈ 1.9
default_theta_deg: 2.0

# Stacking gauge
tau: [0.0, 0.0]

# Grid resolution
phase1_Ns1: 128
phase1_Ns2: 128

# Multi-band settings (match Phase 0)
n_neighbor_bands: 2
n_extra_bands: 8

# MPB solver
mpb_resolution: 32
mpb_registry_samples: 64
mpb_dk: 0.01
mpb_fd_order: 4
mpb_polarization: TM  # overridden by candidate

# Export Bloch fields for Phase 2 Berry connection
export_bloch_fields: true

# Parallelization
mpb_n_workers: 16

# Reference frequency
omega_ref_mode: min

# Diagnostics
phase1_variation_tol: 1.0e-5
